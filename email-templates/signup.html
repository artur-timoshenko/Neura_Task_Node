<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><title>Подтвердите ваш email</title></head>
<body style="background-color:#ffffff;font-family:'JetBrains Mono',Arial,sans-serif"><table role="presentation" style="width:100%;max-width:600px;margin:0 auto"><tr><td style="padding:20px 25px">
<h1 style="font-size:22px;font-weight:bold;color:#0d0d0d;margin:0 0 20px">Подтвердите ваш email</h1>
<p style="font-size:14px;color:#525866;line-height:1.5;margin:0 0 25px">Спасибо за регистрацию в <a href="{{ .SiteURL }}" style="color:inherit;text-decoration:underline"><strong>Neura Task Manager</strong></a>!<br><br>Пожалуйста, подтвердите ваш email (<a href="mailto:{{ .Email }}" style="color:inherit">{{ .Email }}</a>), нажав на кнопку ниже:</p>
<a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#0000cc;color:#ffffff;font-size:14px;border-radius:0;padding:12px 20px;text-decoration:none">Подтвердить Email</a>
<p style="font-size:12px;color:#999999;margin:30px 0 0">Если вы не создавали аккаунт, просто проигнорируйте это письмо.</p>
</td></tr></table></body></html>
